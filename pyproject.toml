[project]
name = "lavida"
version = "0.1.0"
description = "A lightweight, always-on-top desktop widget for managing YouTube video links."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "muriarty1893" },
]
keywords = ["youtube", "pyqt6", "desktop", "widget", "video-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PyQt6>=6.10",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pynput>=1.7",
]

[project.urls]
Homepage = "https://github.com/muriarty1893/lavida"
Repository = "https://github.com/muriarty1893/lavida"
Issues = "https://github.com/muriarty1893/lavida/issues"

[project.scripts]
lavida = "main:main"
